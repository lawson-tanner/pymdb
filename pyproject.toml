[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "python-mdb"
version = "0.1.0"
description = "Read Avid Media Composer msmMMOB.mdb media databases (OMF 1.x in a Bento container)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["avid", "media composer", "omf", "bento", "mdb", "msmMMOB", "post production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lawson-tanner/pymdb"
Documentation = "https://pythonmdb.readthedocs.io"
Repository = "https://github.com/lawson-tanner/pymdb"

[project.optional-dependencies]
test = ["pytest>=7"]
docs = [
    "sphinx>=7,<9",
    "furo>=2024.8.6",
    "sphinx-autodoc-typehints>=2.0",
]

[project.scripts]
mdb = "mdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
